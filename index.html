<script>
const $=s=>document.querySelector(s),app=$('#app');
const now=new Date(),H=now.getHours();
const S={scene:(H>=20||H<6)?'night':'rainy',view:'daily',layer:3,off:0,worn:{},laundry:{}};
const items=[{n:'Lavender shirt',c:'#C9CDF2'},{n:'Taupe blazer',c:'#B49A86'},{n:'Camel coat',c:'#C79A5E'}];
const tips={sunny:['Sun’s out. Light layers and sunglasses.',18,'Sunny','4% rain',21,13],rainy:['93% rain. Take the coat and flat shoes.',19,'Rain','93% rain',20,18],night:['Lay out tomorrow’s look before bed?',14,'Clear','2% rain',15,12]};
const WT={sunny:[14,13,15,18,21,20,17,15],rainy:[18,18,18,19,20,20,19,18],night:[14,13,12,12,13,15,14,14]};
const QS=[['excited','Today’s going to be GREAT!','Let’s make an entrance.'],['shy','Stop, you’re making me blush.','Okay, a little more.'],['proud','I’m so proud of you I could cry.','Look at that outfit!'],['joy','Boop! Hello again.','Ready when you are.']];let qi=0;
const icons={shirt:'<path d="M8 4l-5 3 2 4 3-1v10h8V10l3 1 2-4-5-3c-1 2-2 3-4 3S9 6 8 4z"/>',blazer:'<path d="M9 3l-5 3v14h6l2-8 2 8h6V6l-5-3-3 5z"/>',coat:'<path d="M9 3L5 6v15h5V9m5-6l4 3v15h-5V9M9 3l3 6 3-6"/>'};
const nav=[['Home','<path d="M4 11l8-7 8 7v9H4z"/>'],['Wardrobe','<path d="M8 4l-5 3 2 4 3-1v10h8V10l3 1 2-4-5-3c-1 2-2 3-4 3S9 6 8 4z"/>'],['Create','<path d="M12 5v14M5 12h14"/>'],['Looks','<path d="M12 3l9 9-9 9-9-9z"/>'],['Me','<path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4"/>']];
$('#nav').innerHTML=nav.map((n,i)=>i==2?`<button class="fabw" data-n="Create" aria-label="Create" title="Create"><span class="fab"><svg viewBox="0 0 24 24">${n[1]}</svg></span></button>`:`<button ${i?'':'aria-current="page"'} data-n="${n[0]}" aria-label="${n[0]}" title="${n[0]}"><span class="ic"><svg viewBox="0 0 24 24">${n[1]}</svg></span></button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.n!=='Home')toast(b.dataset.n+' screen comes next')};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const day=o=>{const d=new Date(now);d.setDate(d.getDate()+o);return d};
const key=o=>{const d=day(o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const planned=o=>o===0||o<0||((day(o).getDate()%3)!==0);
function mini(o){if(!planned(o))return'<div class="mini empty"></div>';const l=(day(o).getDate()%3)+1;return`<div class="mini"><span style="background:${items[0].c}"></span><span style="background:${l>1?items[l-1].c:'#2F4380'}"></span><span style="background:#2F4380"></span></div>`}
function fig(l){return `<img class="me" src="assets/me.webp" alt="You, wearing the planned outfit" draggable="false">`}
function render(){
app.dataset.scene=S.scene;const t=tips[S.scene];
$('#t').textContent=t[1]+'°';$('#ti').innerHTML=t[2]+'<br>H '+t[4]+'° · L '+t[5]+'°';wave();

document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.view));
const d=day(S.off);$('#date').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · Carcavelos';
const v=$('#view');
if(S.view==='daily'){const k=key(S.off);
v.innerHTML=`<div class="stage"><div class="photo">${fig(S.layer)}</div>
<div class="side side-l" role="group" aria-label="Outfit actions"><button class="act2" data-a="worn" aria-label="Worn" title="Worn" aria-pressed="${!!S.worn[k]}"><span class="ci"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button><button class="act2" data-a="laundry" aria-label="Laundry" title="Laundry" aria-pressed="${!!S.laundry[k]}"><span class="ci"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="14" r="4"/></svg></span></button></div>
<div class="side side-r" role="group" aria-label="Outfit layers">${['shirt','blazer','coat'].map((n,i)=>`<button class="tab" data-l="${i+1}" aria-label="${n}" title="${n}" aria-pressed="${S.layer===i+1}"><sup>${i+1}</sup><svg viewBox="0 0 24 24">${icons[n]}</svg></button>`).join('')}</div></div>`}
else if(S.view==='weekly'){const mon=S.off-((d.getDay()+6)%7);v.innerHTML='<div class="week">'+[0,1,2,3,4,5,6].map(i=>{const o=mon+i;return`<button class="cell" data-o="${o}" ${o===0?'aria-current="true"':''}>${day(o).toLocaleDateString('en-GB',{weekday:'narrow'})}${mini(o)}${day(o).getDate()}${tagOf(o)?`<i class="tg" style="background:${tagOf(o).c}"></i>`:''}</button>`}).join('')+'</div><p class="names" style="font-size:15px;font-family:Nunito;color:var(--mut)">Tap a day to plan or change its look. Dashed days are still empty.</p>'}
else{const f=new Date(d.getFullYear(),d.getMonth(),1),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),lead=(f.getDay()+6)%7;
v.innerHTML='<div class="month">'+'MTWTFSS'.split('').map(x=>`<span class="h">${x}</span>`).join('')+Array(lead).fill('<span></span>').join('')+Array.from({length:n},(_,i)=>{const o=Math.round((new Date(d.getFullYear(),d.getMonth(),i+1)-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);return`<button class="d" data-o="${o}">${i+1}${tagOf(o)?`<i style="background:${tagOf(o).c}"></i>`:planned(o)?'<i></i>':'<span style="height:6px"></span>'}</button>`}).join('')+'</div>'}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.close!==undefined){closeTags()}
else if(t.dataset.sync!==undefined){syncDemo()}
else if(t.dataset.apply!==undefined){applySync()}
else if(t.dataset.tag!==undefined){setTag(t.dataset.tag)}
else if(t.id==='pbub'){openTags()}
else if(t.id==='pico'){const q=QS[qi++%QS.length];react(q[0],q[1],q[2])}
else if(t.dataset.v){S.view=t.dataset.v;render()}
else if(t.dataset.l){S.layer=+t.dataset.l;render()}
else if(t.dataset.a){const k=key(S.off),m=t.dataset.a==='worn'?S.worn:S.laundry;m[k]=!m[k];if(m[k])react('proud','Look at you!',t.dataset.a==='worn'?'Logged as worn. Lovely look.':'Into the laundry pile it goes.');else react('happy','Undone','No problem.');render()}

else if(t.dataset.today!==undefined){commit(S.off>0?-1:1,0)}});
const TAGS={office:{n:'Office day',c:'#0A66C9',mood:'happy',cheer:'Polished, not stiff. You’ve got this.'},home:{n:'Working from home',c:'#4FD8A5',mood:'sleepy',cheer:'Comfy but camera-ready.'},off:{n:'Day off',c:'#FF7FA8',mood:'joy',cheer:'Wear what makes you smile.'},interview:{n:'Interview',c:'#FFD60F',mood:'focus',cheer:'Sharp look. Deep breath, you’re ready.'},first:{n:'First day of work',c:'#8E7CF0',mood:'proud',cheer:'Big day! First impressions, nailed.'},event:{n:'Special occasion',c:'#FF9A5C',mood:'excited',cheer:'Time to stand out a little.'}};
let TG={};try{TG=JSON.parse(localStorage.getItem('stella-tags')||'{}')}catch(e){}

(function(){const sn=Math.sin,PI=Math.PI,N=24,X0=21,X1=79,W=X1-X0,B=[],H=[];

const cr=(pts)=>{let d='';for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(2)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(2)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(2)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`}return d};

const top=`M${X0} 51A29 29 0 0 1 ${X1} 51`;
B.push(`${top}L${X1} ${hp[9][1].toFixed(2)}${cr(hp.slice().reverse())}Z`);
